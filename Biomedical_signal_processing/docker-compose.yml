services:
  fetal-ecg:
    build: .
    image: fetal-ecg-project
    container_name: fetal-ecg-project
    working_dir: /app
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - .:/app
    command: >
      jupyter lab
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --allow-root
      --ServerApp.token=
      --ServerApp.password=
